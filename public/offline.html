<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17120e" />
    <title>圏外です | 宣言ボード</title>
    <style>
      html, body { height: 100%; margin: 0; background: #17120e; color: #f2e9dc; font-family: system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; max-width: 448px; margin: 0 auto; }

      h1 { margin: 0; font-size: 24px; }
      p { margin: 0; line-height: 1.7; color: #b8a894; }
      button { min-height: 44px; border: 0; border-radius: 8px; background: #e0a34e; color: #17120e; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <small>BARREL HOUSE</small>
      <h1>電波が届いていないみたい</h1>
      <p>つながる場所に移動してから、もう一度開いてください。</p>
      <button type="button" onclick="location.reload()">もう一度開く</button>
    </main>
  </body>
</html>
